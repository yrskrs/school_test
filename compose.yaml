name: ${COMPOSE_PROJECT_NAME:-schooltest5}
services:
  app:
    image: ${SCHOOLTEST_IMAGE:-schooltest5-app:1.4.1}
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-local}
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - app_data:/app/data
      - app_uploads:/app/app/static/tests
      - app_general_uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schooltest_net

  postgres:
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schooltest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-schooltest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schooltest_net

volumes:
  app_data:
  app_uploads:
  app_general_uploads:
  postgres_data:

networks:
  schooltest_net:
