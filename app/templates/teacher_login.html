{% extends "base.html" %}
{% block title %}Вхід для вчителя{% endblock %}
{% block navbar %}{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
  </div>
  <h1 class="auth-title">ШколярТест</h1>
  <p class="auth-subtitle">Вхід для вчителя</p>

  <form method="post" action="/teacher/login" class="auth-form">
    <div class="form-group">
      <label for="username">Логін</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="admin"
        autocomplete="username"
        required
        autofocus
      />
    </div>
    <div class="form-group">
      <label for="password">Пароль</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary btn-full">Увійти</button>
  </form>

  <div class="auth-divider"></div>
  <p class="auth-hint">
    Учень? <a href="/student/login">Перейти до входу учня</a>
  </p>
</div>
{% endblock %}
